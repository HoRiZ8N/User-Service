spring:
  application:
    name: user-service
  profiles:
    default: local
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
  data:
    web:
      pageable:
        max-page-size: 100
  cache:
    type: redis
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  cache:
    users-ttl: ${CACHE_USERS_TTL:10m}
  security:
    jwt:
      issuer: ${JWT_ISSUER:http://localhost:8180/realms/shop}
      jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/shop/protocol/openid-connect/certs}
